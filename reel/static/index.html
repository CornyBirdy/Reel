<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel</title>
  <meta name="description" content="Local AI image and video generation.">
  <meta name="theme-color" content="">
  <link rel="icon" type="image/svg+xml" href="/static/icons/reel.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/reel-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/reel-16.png">
  <link rel="apple-touch-icon" href="/static/icons/reel-180.png">
  <link rel="manifest" href="/static/manifest.json">
  <script>
    /* Apply a saved manual theme before first paint (no flash). */
    try {
      var t = localStorage.getItem("reel.theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/icons/reel.svg" width="32" height="32" alt="">
        <div class="brand-text">
          <div class="brand-name">Reel</div>
          <div class="brand-tag">Image &amp; video, locally</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot">
        <a class="update-pill" id="update-pill" href="#/settings" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg><span>Update available</span></a>
        <div class="gpu-chip" id="gpu-chip"></div>
        <div class="seg seg-fill" id="theme-toggle" role="group" aria-label="Theme"></div>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
