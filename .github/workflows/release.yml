name: Release

# Builds Reel-vX.Y.Z.zip and publishes a GitHub Release whose notes are the matching CHANGELOG.md section.
# Start it either by pushing a tag like v0.1.0, or from the Actions tab: Run workflow > version 0.1.0
# (the workflow then creates the tag itself).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must have a section in CHANGELOG.md)"
        required: true
        default: "0.1.0"

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Build the zip
        run: |
          # git archive expands reel/VERSION (export-subst), so the app knows exactly which version it is.
          REF=HEAD; [ "${{ github.event_name }}" = "push" ] && REF="$TAG"
          git archive --format=zip --prefix=Reel/ -o "Reel-${TAG}.zip" "$REF"
          unzip -l "Reel-${TAG}.zip" | tail -3

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" >&2; exit 1; fi
          {
            echo "**To install:** download \`Reel-${TAG}.zip\` below, extract it (for example to \`C:\\Reel\`), and double-click \`start.bat\`."
            echo
            cat notes.md
          } > body.md
          cat body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Reel ${{ env.TAG }}
          body_path: body.md
          files: Reel-${{ env.TAG }}.zip
          prerelease: ${{ contains(env.TAG, '-') }}
